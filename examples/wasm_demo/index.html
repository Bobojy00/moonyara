<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moonyara - 浏览器 WebAssembly 扫描演示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-title">
        <span>moonyara</span>
        <span class="badge">WebAssembly</span>
      </div>
      <div>
        <span id="engineStatus" style="font-size: 0.85rem; color: #8b949e;">正在加载 MoonBit Wasm 引擎...</span>
      </div>
    </header>

    <div class="grid">
      <!-- Rule Editor -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">YARA 规则定义</span>
          <div class="controls">
            <select id="ruleTemplateSelect">
              <option value="webshell">模板：Webshell 检出</option>
              <option value="xor">模板：单字节 XOR 混淆特征</option>
              <option value="base64">模板：Base64 编码特征</option>
              <option value="powershell">模板：PowerShell 混淆脚本</option>
              <option value="ransomware">模板：勒索信特征</option>
              <option value="c2">模板：C2 通信特征</option>
            </select>
            <button id="validateBtn">语法校验</button>
          </div>
        </div>
        <textarea id="ruleInput" spellcheck="false"></textarea>
      </div>

      <!-- Sample Target -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">待检测目标数据</span>
          <div class="controls">
            <button id="loadMaliciousSample">加载匹配样本</button>
            <button id="loadCleanSample">加载未匹配样本</button>
          </div>
        </div>
        <textarea id="sampleInput" placeholder="在此粘贴待测文本或二进制字符串..." spellcheck="false"></textarea>
        <div class="drop-zone" id="dropZone">
          拖拽本地文件到此区域进行检测（本地处理，不上传）
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
      <button id="scanBtn" class="primary" style="font-size: 1rem; padding: 10px 32px;">
        执行扫描
      </button>
    </div>

    <!-- Scan Results -->
    <div class="report-panel">
      <div class="report-header">
        <span>扫描检测报告</span>
        <span id="matchSummary" style="font-weight: 400; font-size: 0.85rem; color: #8b949e;">尚未扫描</span>
      </div>
      <div id="reportOutput" class="report-output">点击上方按钮开始扫描...</div>
    </div>

    <!-- Hex Dump Inspector -->
    <div class="card" style="margin-top: 20px;">
      <div class="card-header">
        <span class="card-title">十六进制转储 (Hex Dump)</span>
        <span id="hexMeta" style="font-size: 0.85rem; color: #8b949e;">未加载数据</span>
      </div>
      <div id="hexDumpContainer" class="hex-dump-container">
        <div class="hex-dump-placeholder">扫描后显示十六进制与 ASCII 内容及命中位置</div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
